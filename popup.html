<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 340px; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    p { font-size: 11px; color: #555; margin: 4px 0 8px; }
    textarea { width: 100%; height: 120px; box-sizing: border-box; font-size: 12px; }
    button { width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #333; white-space: pre-wrap; }
    hr { margin: 12px 0; }
  </style>
</head>
<body>
  <h3>SP Claim Modifier Fixer</h3>

  <p>Filter to Action Required manually on the list page, then:</p>

  <p><b>Step 1</b> — Grab the claim links (or paste your own):</p>
  <textarea id="links" placeholder="https://secure.simplepractice.com/billings/insurance/claims_filed?modalClaimId=123456"></textarea>
  <button id="grabBtn">Grab links from this page</button>

  <hr>

  <p><b>Step 2</b> — Open each claim in a tab; the extension corrects and saves the modifier, then leaves it for you to review and submit:</p>
  <button id="openBtn">Open tabs &amp; auto-fix each</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
